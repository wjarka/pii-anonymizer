name: Electron desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. desktop-v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mac-x64
            os: macos-15-intel
            command: npm run electron:build-renderer && npm run electron:stage && npx electron-builder --mac dmg zip --x64 --config electron-builder-ci.yml
            appPath: release/desktop/mac/pii.tools.app
          - label: mac-arm64
            os: macos-15
            command: npm run electron:build-renderer && npm run electron:stage && npx electron-builder --mac dmg zip --arm64 --config electron-builder-ci.yml
            appPath: release/desktop/mac-arm64/pii.tools.app
          - label: win-x64
            os: windows-latest
            command: npm run electron:dist:win
            appPath: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- electron/protocol.test.js scripts/prepare-electron-app.test.js src/desktop-active-work.test.js scripts/electron-release-signing.test.js
      - run: ${{ matrix.command }}
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=4 "${{ matrix.appPath }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*-setup.exe
            release/desktop/*-portable.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## pii.tools desktop

          Download the file matching your system:

          - macOS Apple Silicon: `pii-tools-*-mac-arm64.dmg`
          - macOS Intel: `pii-tools-*-mac-x64.dmg`
          - Windows installer: `pii-tools-*-win-x64-setup.exe`
          - Windows portable: `pii-tools-*-win-x64-portable.exe`

          These early desktop builds are unsigned. macOS may require right-click -> Open on first launch. Windows SmartScreen may warn about an unknown publisher; continue only when the file came from this GitHub Release.

          First use may download NER models and runtime components. OCR models are bundled with the desktop application. Later launches reuse the local application cache unless the user clears app data/cache.
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release create "$TAG" release-assets/* --title "$TAG" --notes-file release-notes.md
